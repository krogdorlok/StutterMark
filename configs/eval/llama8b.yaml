# Complete eval-suite config (full run). See docs/eval.md.
# Usage: uv run python scripts/eval/capability.py --config configs/eval/llama8b.yaml --exp E1
name: llama8b
seed: 1234

model:
  hub_id: meta-llama/Llama-3.1-8B-Instruct
adapter_dir: outputs/checkpoints/llama8b_alpaca_n1000
data:
  processed_dir: data/processed/alpaca_n1000_taf1_s42_9d2818/
results_dir: outputs/results/llama8b

# E1-E4, E8 via lm-eval. Metric keys are lm-eval's "metric,filter". limit: null = full task.
capability:
  batch_size: "auto"  # lm-eval probes the largest batch that fits
  max_length: 2048  # context cap for loglikelihood/perplexity windows (model default can be 32k)
  limit: null
  apply_chat_template: true
  fewshot_as_multiturn: true
  experiments:
    E1:
      - {task: gsm8k_cot, num_fewshot: 8, metrics: ["exact_match,flexible-extract", "exact_match,strict-match"]}
    E2:
      - {task: mmlu, num_fewshot: 5, metrics: ["acc,none"]}
      - {task: arc_challenge, num_fewshot: 25, metrics: ["acc_norm,none"]}
      - {task: hellaswag, num_fewshot: 10, metrics: ["acc_norm,none"]}
      - {task: truthfulqa_mc2, num_fewshot: 0, metrics: ["acc,none"]}
    E3:
      - task: ifeval
        num_fewshot: 0
        metrics: [prompt_level_strict_acc, inst_level_strict_acc, prompt_level_loose_acc, inst_level_loose_acc]
    E4:
      - {task: wikitext, num_fewshot: 0, metrics: ["word_perplexity,none"], apply_chat_template: false}
    E8:
      - {task: gsm8k_cot, num_fewshot: 8, metrics: ["exact_match,flexible-extract"], limit: 200}

# E5-E7 via timed/batched greedy generate.
generation:
  max_new_tokens: 512
  trigger_max_new_tokens: 2048
  merge_adapter: true  # time the LoRA folded into the weights, as it would be deployed
  batch_size: 8
  E5:
    alpaca_test_limit: null
    alpacaeval_path: hf://datasets/tatsu-lab/alpaca_eval/alpaca_eval.json
    alpacaeval_limit: null
  E6:
    limit: null

similarity:
  bertscore_model: roberta-large
  batch_size: 32

# Pairwise judge over an OpenAI-compatible endpoint (env JUDGE_BASE_URL, JUDGE_API_KEY).
judge:
  model: Qwen/Qwen2.5-72B-Instruct
  max_tokens: 32
  retries: 3
  backoff_s: 1.0  # wait before retrying an API error, doubling each attempt
  concurrency: 8
  limit: null

report:
  margin: 0.02
  ppl_ratio_flag: 1.05
  win_tie_min: 0.45
  max_invalid_rate: 0.05  # E5 fails if more judge verdicts than this are unparseable
  auc_min: 0.95
  control_auc_tol: 0.1
  bootstrap_n: 10000
