# Complete train config. Usage: uv run python scripts/train.py --config configs/train/qwen05.yaml
# Copy this file to sweep r / alpha / target_modules later — no grid runner.
model:
  hub_id: Qwen/Qwen2.5-0.5B-Instruct

data:
  processed_dir: data/processed/alpaca_n700_taf0.1_s42_67250b/

lora:
  r: 16
  alpha: 16
  dropout: 0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_steps: 200
  warmup_steps: 10
  learning_rate: 2.0e-4
  lr_scheduler_type: linear
  weight_decay: 0.01
  per_device_batch_size: 4
  grad_accum: 4
  max_seq_len: 2048
  gradient_checkpointing: true
  seed: 42

output_dir: outputs/checkpoints/qwen05_alpaca_n700
