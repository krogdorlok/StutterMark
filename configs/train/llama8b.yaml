# Llama 3.1 8B LoRA run on the 10,000-example Alpaca dataset.
# Meta does not publish a Llama 3.x 7B model; access is gated on Hugging Face.
model:
  hub_id: meta-llama/Llama-3.1-8B-Instruct

data:
  processed_dir: data/processed/alpaca_n1000_taf1_s42_9d2818/

lora:
  r: 16
  alpha: 16
  dropout: 0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  max_steps: 200
  warmup_steps: 10
  learning_rate: 2.0e-4
  lr_scheduler_type: linear
  weight_decay: 0.01
  per_device_batch_size: 4
  grad_accum: 4
  max_seq_len: 2048
  gradient_checkpointing: true
  seed: 42

output_dir: outputs/checkpoints/llama8b_alpaca_n1000
