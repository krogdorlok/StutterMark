# OLMo 3 7B LoRA run on the 10,000-example Alpaca dataset.
model:
  hub_id: allenai/Olmo-3-7B-Instruct

data:
  processed_dir: data/processed/alpaca_n1000_taf0.5_s42_187e53

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]

train:
  epochs: 1
  learning_rate: 2.0e-4
  per_device_batch_size: 2
  grad_accum: 8
  max_seq_len: 1024
  seed: 42

output_dir: outputs/checkpoints/olmo7b_alpaca_n1000
